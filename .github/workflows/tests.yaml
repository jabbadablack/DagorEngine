name: tests

# Builds and runs the engine's tests with dng.py test (see _docs/source/testing). Hosted runners have no GPU, so targets
# that require one are skipped (--gpu no); GPU code is still covered by the *.stub variants on the stub 3d driver.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DAGOR_NONINTERACTIVE: '1'

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            devtools: D:/devtools
          - os: ubuntu-22.04
            devtools: /home/runner/devtools
          - os: macos-15 # Xcode 16: the Metal driver needs the macOS 15 SDK (MTLResidencySet)
            devtools: /Users/runner/devtools
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache devtools
        uses: actions/cache@v4
        with:
          path: ${{ matrix.devtools }}/.packages # downloads only: the rest links to software of the runner machine (Visual Studio, SDKs, Xcode)
          key: devtools-packages-${{ matrix.os }}-${{ hashFiles('make_devtools*.py') }}

      - name: Set up devtools
        shell: bash
        run: |
          python make_devtools.py "${{ matrix.devtools }}"
          echo "GDEVTOOL=${{ matrix.devtools }}" >> "$GITHUB_ENV"
          echo "${{ matrix.devtools }}" >> "$GITHUB_PATH"

      - name: Run tests
        shell: bash
        run: |
          python dng.py test run --gpu no -j 4 --out _output/test_results/ci \
            --junit test-results.xml --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: |
            _output/test_results/ci
            test-results.xml
          if-no-files-found: ignore
